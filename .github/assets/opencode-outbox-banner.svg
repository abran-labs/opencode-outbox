      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1800" height="380" fill="#191f23"/>
  <path d="M144 190H260M1540 190H1656" stroke="#424f56" stroke-width="2"/>
