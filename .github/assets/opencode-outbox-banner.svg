    <path d="M112 118V53M86 79L112 53 138 79" fill="none" stroke="#77d6c0" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" opacity=".34"/>
    <path d="M112 118V53M86 79L112 53 138 79" fill="none" stroke="#77d6c0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
