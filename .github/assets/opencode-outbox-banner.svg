<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="380" viewBox="0 0 1800 380" role="img" aria-labelledby="title desc">
  <title id="title">OpenCode Outbox</title>
  <desc id="desc">OpenCode Outbox wordmark beside an upward arrow over an outbox tray.</desc>
